<html lang="en">
<head>
        <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackHub - Register</title>
</head>
<body>
          <main class="login auth-card registration-card">
    <h1>
        StackHub
    </h1>
        <p class="auth-subtitle">Create your account to access StudentHub.</p>
        <form class="registration-form" action="register.php" method="post" onsubmit="return vreg()">
            <input type="text" id="full-name" name="full_name" placeholder="Full Name" aria-label="Full name" autocomplete="name" maxlength="80" required>
            <input type="text" id="uname" name="username" placeholder="Username" aria-label="Username" autocomplete="username" maxlength="20" required>
            <input type="email" id="email" name="email" placeholder="Email" aria-label="Email address" autocomplete="email" required>
            <input type="tel" id="phone" name="phone" placeholder="Mobile Number" aria-label="Mobile number" autocomplete="tel" maxlength="10" pattern="[0-9]{10}" required>
            <select id="course" name="course" required>
                <option value="" selected disabled>Choose Course</option>
                <option value="B.Tech Computer Science">B.Tech Computer Science</option>
                <option value="B.Tech Information Technology">B.Tech Information Technology</option>
                <option value="B.Tech Data Science">B.Tech Data Science</option>
                <option value="B.Tech Cyber Security">B.Tech Cyber Security</option>
            </select>
            <select id="year" name="year" required>
                <option value="" selected disabled>Choose Year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <fieldset class="gender-group">
                <legend>Gender</legend>
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </fieldset>
            <input type="password" id="pass" name="password" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
            <input type="password" id="confirm-pass" name="confirm_password" placeholder="Confirm Password" aria-label="Confirm password" autocomplete="new-password" required>
            <label class="terms-option"><input type="checkbox" id="terms" name="terms" value="accepted" required> I accept the terms and conditions</label>
            <button class="primary-btn" type="submit">Register</button>
        </form>
    <a href="login.html">Already have an account? Login</a>
    <div id="errmsg" style="color: red; margin-bottom: 10px;"></div>
    </main>
        <script src="script.js"></script>

</body>
</html>
